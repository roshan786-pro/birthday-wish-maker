<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Birthday Wish Maker 💗</title>
<meta name="theme-color" content="#ff5aa8">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
 --pink:#ff5ca8;
 --pink2:#ff8fc8;
 --purple:#9b6cff;
 --ink:#351b35;
 --muted:#8d7187;
 --line:#f2dce9;
}

body{
 min-height:100vh;
 font-family:"DM Sans",sans-serif;
 color:var(--ink);
 background:
 radial-gradient(circle at 10% 10%,rgba(255,155,208,.45),transparent 30%),
 radial-gradient(circle at 90% 15%,rgba(180,143,255,.32),transparent 30%),
 linear-gradient(135deg,#fff5fb,#f9f2ff 55%,#fff8fc);
 overflow-x:hidden;
}

.container{
 width:min(900px,92%);
 margin:auto;
}

.creator{
 padding:50px 0 70px;
}

.brand{
 text-align:center;
 margin-bottom:28px;
}

.mini{
 display:inline-block;
 padding:8px 14px;
 border:1px solid #f2cce0;
 background:#ffffffc9;
 border-radius:999px;
 color:#a04b78;
 font-size:13px;
 font-weight:700;
}

.brand h1{
 font-family:"Playfair Display",serif;
 font-size:clamp(42px,7vw,76px);
 line-height:1;
 margin:18px 0 12px;
 background:linear-gradient(90deg,#ff4f9c,#9c67ff);
 -webkit-background-clip:text;
 color:transparent;
}

.brand p{
 color:#8c7185;
}

.card{
 background:#ffffffd1;
 border:1px solid white;
 border-radius:34px;
 padding:clamp(24px,5vw,46px);
 box-shadow:0 30px 90px #6a356719;
 backdrop-filter:blur(18px);
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:20px;
}

.full{
 grid-column:1/-1;
}

.field label{
 display:block;
 font-weight:700;
 font-size:14px;
 margin-bottom:9px;
 color:#54364d;
}

input,textarea{
 width:100%;
 border:1.5px solid var(--line);
 background:#fffafc;
 color:var(--ink);
 border-radius:16px;
 padding:15px 16px;
 font:inherit;
 outline:none;
}

input:focus,textarea:focus{
 border-color:#eaa1c7;
 box-shadow:0 0 0 4px #ff5ca817;
}

textarea{
 min-height:145px;
 resize:vertical;
}

.theme-row{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.theme-option input{
 display:none;
}

.theme-option label{
 margin:0;
 padding:13px 8px;
 border:1.5px solid var(--line);
 border-radius:14px;
 text-align:center;
 cursor:pointer;
 background:white;
}

.theme-option input:checked+label{
 border-color:#ff76b5;
 background:#fff1f8;
 color:#c23b7c;
}

.photo-box{
 border:1.5px dashed #e7bfd5;
 border-radius:18px;
 padding:20px;
 background:#fffafd;
 text-align:center;
}

.photo-box strong{
 display:block;
 margin-top:6px;
}

.photo-box small{
 display:block;
 color:#a78d9f;
 margin-top:5px;
}

#photos{
 display:none;
}

.previews{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:12px;
}

.preview{
 width:78px;
 height:78px;
 border-radius:14px;
 object-fit:cover;
}

.create{
 width:100%;
 border:0;
 border-radius:18px;
 padding:17px;
 margin-top:8px;
 color:white;
 background:linear-gradient(100deg,#ff4f9e,#b16bff);
 font:700 17px "DM Sans";
 cursor:pointer;
 box-shadow:0 15px 30px #d74b9e3d;
}

.note{
 text-align:center;
 color:#a18b9a;
 font-size:12px;
 margin-top:13px;
}

.result{
 display:none;
 margin-top:22px;
 padding:18px;
 border-radius:18px;
 background:#fff5fa;
 border:1px solid #f4d8e6;
}

.result.show{
 display:block;
}

.result-title{
 font-weight:800;
}

.linkbox{
 margin:10px 0;
 padding:12px;
 background:white;
 border:1px solid #eed5e2;
 border-radius:12px;
 word-break:break-all;
 font-size:13px;
}

.copy{
 border:0;
 background:#3f2940;
 color:white;
 border-radius:11px;
 padding:10px 14px;
 font-weight:700;
 cursor:pointer;
}

.hidden{
 display:none!important;
}

/* SURPRISE */

.wish-page{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:35px 16px;
}

.wish-card{
 width:min(900px,96%);
 min-height:600px;
 border-radius:40px;
 padding:45px 28px;
 text-align:center;
 background:#ffffffe0;
 box-shadow:0 35px 110px #552a551c;
 position:relative;
 overflow:hidden;
}

.envelope{
 width:190px;
 height:125px;
 margin:10px auto 35px;
 background:linear-gradient(145deg,#ff67ad,#a967ff);
 border-radius:12px 12px 20px 20px;
 box-shadow:0 20px 35px #b54b9f38;
 position:relative;
}

.envelope:before{
 content:"";
 position:absolute;
 left:0;
 top:0;
 border-left:95px solid transparent;
 border-right:95px solid transparent;
 border-top:72px solid #ffacd2;
}

.envelope:after{
 content:"💗";
 position:absolute;
 background:white;
 width:68px;
 height:68px;
 border-radius:50%;
 display:grid;
 place-items:center;
 font-size:30px;
 bottom:-26px;
 left:61px;
}

.badge{
 font-size:12px;
 letter-spacing:4px;
 font-weight:800;
 color:#b15b89;
}

.wish-date{
 font-size:15px;
 color:#a47d96;
 margin:13px 0;
}

.wish-name{
 font-family:"Playfair Display",serif;
 font-size:clamp(45px,9vw,88px);
 line-height:1.03;
 margin:8px 0 18px;
 background:linear-gradient(90deg,#ff4d9f,#9c67ff);
 -webkit-background-clip:text;
 color:transparent;
}

.wish-message{
 max-width:700px;
 margin:auto;
 font-size:clamp(17px,2.5vw,23px);
 line-height:1.75;
 white-space:pre-wrap;
}

.from{
 margin-top:24px;
 color:#90657f;
}

.actions{
 display:flex;
 justify-content:center;
 gap:10px;
 flex-wrap:wrap;
 margin-top:32px;
}

.actions button{
 border:0;
 border-radius:13px;
 padding:12px 17px;
 font-weight:700;
 cursor:pointer;
}

.primary{
 background:#3f2940;
 color:white;
}

.secondary{
 background:white;
 color:#68485d;
 border:1px solid #ead7e2!important;
}

.footer{
 margin-top:28px;
 color:#b19aa9;
 font-size:12px;
}

.float-heart{
 position:fixed;
 bottom:-30px;
 font-size:20px;
 opacity:.55;
 animation:rise linear forwards;
}

@keyframes rise{
 to{
  transform:translateY(-115vh) rotate(25deg);
  opacity:0;
 }
}

.confetti{
 position:fixed;
 top:-15px;
 width:8px;
 height:14px;
 border-radius:2px;
 z-index:20;
 animation:fall 3.8s linear forwards;
}

@keyframes fall{
 to{
  transform:translateY(110vh) rotate(720deg);
  opacity:.2;
 }
}

@media(max-width:650px){
 .form-grid{
  grid-template-columns:1fr;
 }
 .full{
  grid-column:auto;
 }
 .wish-card{
  padding:30px 18px;
 }
}
</style>
</head>

<body>

<section id="creator" class="creator">
<div class="container">

<div class="brand">
<div class="mini">💌 PRIVATE BIRTHDAY SURPRISE</div>

<h1>Create Your Surprise 💗</h1>

<p>Make a beautiful birthday page and share it with someone special.</p>
</div>

<div class="card">

<div class="form-grid">

<div class="field">
<label>💗 Name</label>
<input id="birthdayName" placeholder="Enter name..." maxlength="40">
</div>

<div class="field">
<label>✍️ Your name</label>
<input id="senderName" placeholder="Enter your name..." maxlength="40">
</div>

<div class="field">
<label>🎂 Birthday</label>
<input id="birthdayDate" type="date">
</div>

<div class="field">

<label>✨ Theme</label>

<div class="theme-row">

<div class="theme-option">
<input type="radio" id="pink" name="theme" value="pink" checked>
<label for="pink">💗 Pink</label>
</div>

<div class="theme-option">
<input type="radio" id="purple" name="theme" value="purple">
<label for="purple">💜 Purple</label>
</div>

<div class="theme-option">
<input type="radio" id="dark" name="theme" value="dark">
<label for="dark">🌙 Dark</label>
</div>

</div>
</div>

<div class="field full">

<label>💌 Your message</label>

<textarea id="message" placeholder="Write something special..."></textarea>

</div>

<div class="field full">

<label>📸 Photos</label>

<div class="photo-box"
onclick="document.getElementById('photos').click()">

<div style="font-size:28px">＋</div>

<strong>Add photos</strong>

<small>Photos are for preview only</small>

</div>

<input id="photos" type="file" accept="image/*" multiple>

<div id="previews" class="previews"></div>

</div>

</div>

<button class="create" onclick="generateWish()">
✨ CREATE MY SURPRISE ✨
</button>

<div class="note">
Your name, message, date and theme are stored in the link.
</div>

<div id="result" class="result">

<div class="result-title">
🎀 Your surprise link is ready!
</div>

<div id="linkText" class="linkbox"></div>

<button class="copy" onclick="copyLink()">
Copy link 💗
</button>

</div>

</div>
</div>
</section>


<section id="wish" class="wish-page hidden">

<div class="wish-card">

<div class="envelope"></div>

<div class="badge">
✨ A LITTLE SURPRISE FOR YOU ✨
</div>

<div id="wishDate" class="wish-date"></div>

<div id="wishName" class="wish-name"></div>

<div id="wishMessage" class="wish-message"></div>

<div id="wishFrom" class="from"></div>

<div class="actions">

<button class="primary" onclick="shareSurprise()">
↗ Share Surprise
</button>

<button class="secondary" onclick="createAnother()">
Create Another
</button>

</div>

<div class="footer">
Made with love ♡
</div>

</div>
</section>


<script>

function encodeData(data){

return btoa(
unescape(
encodeURIComponent(
JSON.stringify(data)
)
)
);

}


function decodeData(data){

return JSON.parse(
decodeURIComponent(
escape(
atob(data)
)
)
);

}


function getTheme(){

return document.querySelector(
'input[name="theme"]:checked'
).value;

}


/* PHOTO PREVIEW ONLY */

document.getElementById("photos").addEventListener(
"change",
function(e){

const files=[...e.target.files].slice(0,3);

const previews=document.getElementById("previews");

previews.innerHTML="";

files.forEach(file=>{

const reader=new FileReader();

reader.onload=function(){

const img=document.createElement("img");

img.className="preview";

img.src=reader.result;

previews.appendChild(img);

};

reader.readAsDataURL(file);

});

});


/* CREATE SHORT LINK */

function generateWish(){

const birthdayName=
document.getElementById("birthdayName").value.trim();

const senderName=
document.getElementById("senderName").value.trim();

const birthdayDate=
document.getElementById("birthdayDate").value;

const message=
document.getElementById("message").value.trim();

const theme=getTheme();


if(!birthdayName || !senderName || !message){

alert("Please fill Name, Your name and Your message 💗");

return;

}


const data={
birthdayName,
senderName,
birthdayDate,
message,
theme
};


const encoded=encodeData(data);

const link=
location.href.split("#")[0]+
"#surprise="+
encoded;


document.getElementById("linkText").textContent=link;

document.getElementById("result").classList.add("show");

history.replaceState(null,"",link);

document.getElementById("result").scrollIntoView({
behavior:"smooth",
block:"center"
});

}


/* COPY */

function copyLink(){

const link=
document.getElementById("linkText").textContent;

navigator.clipboard.writeText(link).then(()=>{

alert("Link copied! 💗");

});

}


/* LOAD SURPRISE */

function loadSurprise(){

if(!location.hash.startsWith("#surprise=")) return;

try{

const data=
decodeData(
location.hash.slice(10)
);


document.getElementById("creator")
.classList.add("hidden");

document.getElementById("wish")
.classList.remove("hidden");


document.getElementById("wishName")
.textContent=
data.birthdayName || "";


document.getElementById("wishMessage")
.textContent=
data.message || "";


document.getElementById("wishFrom")
.textContent=
data.senderName
?
"— "+data.senderName+" ♡"
:
"";


if(data.birthdayDate){

const d=
new Date(data.birthdayDate+"T00:00:00");

document.getElementById("wishDate")
.textContent=
d.toLocaleDateString(
undefined,
{
day:"numeric",
month:"long",
year:"numeric"
}
);

}


applyTheme(data.theme || "pink");

hearts();

confetti();

}
catch(error){

console.error(error);

}

}


/* THEMES */

function applyTheme(theme){

if(theme==="dark"){

document.body.style.background=
"linear-gradient(135deg,#130a18,#211126,#0e0913)";

document.querySelector(".wish-card").style.background=
"rgba(31,20,37,.95)";

document.querySelector(".wish-message").style.color=
"#f0dce9";

document.querySelector(".wish-date").style.color=
"#d2a8c1";

document.querySelector(".from").style.color=
"#cba2bb";

}

else if(theme==="purple"){

document.body.style.background=
"linear-gradient(135deg,#f6f1ff,#eee8ff,#fff7fc)";

}

}


/* SHARE */

function shareSurprise(){

if(navigator.share){

navigator.share({
title:"A birthday surprise 💗",
url:location.href
});

}

else{

navigator.clipboard.writeText(location.href)
.then(()=>alert("Surprise link copied! 💗"));

}

}


/* CREATE AGAIN */

function createAnother(){

location.href=
location.href.split("#")[0];

}


/* FLOATING HEARTS */

function hearts(){

for(let i=0;i<15;i++){

const h=
document.createElement("div");

h.className="float-heart";

h.textContent=
["♡","♥","💗","✨"]
[Math.floor(Math.random()*4)];

h.style.left=
Math.random()*100+"vw";

h.style.animationDuration=
(6+Math.random()*6)+"s";

h.style.fontSize=
(14+Math.random()*18)+"px";

document.body.appendChild(h);

setTimeout(
()=>h.remove(),
13000
);

}

}


/* CONFETTI */

function confetti(){

for(let i=0;i<75;i++){

const c=
document.createElement("div");

c.className="confetti";

c.style.left=
Math.random()*100+"vw";

c.style.animationDelay=
Math.random()*1.8+"s";

c.style.background=
"hsl("+Math.random()*360+",85%,68%)";

document.body.appendChild(c);

setTimeout(
()=>c.remove(),
5200
);

}

}


loadSurprise();

</script>

</body>
</html>
